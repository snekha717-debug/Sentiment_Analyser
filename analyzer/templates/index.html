<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analyzer</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <div class="card">

            <h1>✨ Sentiment Analysis</h1>

            <textarea
                id="textInput"
                placeholder="Type your review, feedback, or sentence here..."
            ></textarea>

            <button id="analyzeBtn">
                Analyze Sentiment
            </button>

            <div id="result"></div>

        </div>
    </div>

    <script src="{% static 'script.js' %}"></script>

</body>
</html>
